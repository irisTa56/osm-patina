# URL-pattern excludes (not path excludes): every file stays in scope, so a real
# link added anywhere is still checked. Only URLs that are unverifiable by
# construction are skipped.
exclude = [
    # Loopback URLs are reachable only while a local process is running.
    "^http://127\\.0\\.0\\.1[:/]",
    "^http://localhost[:/]",
    # RFC 2606 reserved example.com (and any subdomain) is non-routable sample
    # data; never a real link.
    "^https?://([a-z0-9-]+\\.)*example\\.com([:/]|$)",
]

# The settings every invocation shares -- hence here rather than on each command
# line. This repository's own invocations name this file with `--config`, so a
# config that cannot be found fails the commit and the PR instead of narrowing
# the walk in silence. The shared `link-check:staged` names none: lychee finds it
# by this name at the repository root, and without it that task runs on lychee's
# defaults with nothing printed, so this file keeps its name and place.

# lychee skips dotdirs by default, and says nothing of it, so Markdown tracked
# under one, such as `.github/` or `.claude/`, would go unchecked.
# `.claude/worktrees/` stays out anyway: the call sites' `.` target is
# gitignore-aware, where a `**` glob would not be.
hidden = true

# A link into a section that was renamed or moved, or into text that was
# reworded, otherwise passes on the filename alone. `full` checks both anchor
# (`#section`) and text (`#:~:text=`) fragments.
include_fragments = "full"
